<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#168A4A" />
    <meta id="app-application-name" name="application-name" content="Andrey-Fit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta id="app-apple-title" name="apple-mobile-web-app-title" content="Andrey-Fit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" id="app-manifest" />
    <script>
      (function(){
        var trainer=new URLSearchParams(location.search).get('app')==='trainer';
        window.__andreyFitPwaVariant=trainer?'trainer':'client';
        var name=trainer?'Andrey-Fit Trainer':'Andrey-Fit';
        var manifest=document.getElementById('app-manifest');
        if(manifest)manifest.setAttribute('href',trainer?'/manifest-trainer.json?v=1':'/manifest.json?v=8');
        var appName=document.getElementById('app-application-name');
        if(appName)appName.setAttribute('content',name);
        var appleTitle=document.getElementById('app-apple-title');
        if(appleTitle)appleTitle.setAttribute('content',name);
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      html,body,#root{min-height:100%;margin:0}
      html,body{background:#f4f6f8}
      body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #root{visibility:hidden}
      #app-boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#f4f6f8}
      .app-boot-card{width:min(360px,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 22px;border:1px solid #dbe5df;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(25,45,34,.08);color:#17202e;text-align:center}
      .app-boot-mark{width:62px;height:62px;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(22,138,74,.18)}
      .app-boot-mark img{display:block;width:100%;height:100%;object-fit:cover}
      .app-boot-name{font-size:18px;font-weight:700}
      .app-boot-dot{width:26px;height:26px;border:3px solid rgba(23,32,46,.12);border-top-color:#168a4a;border-radius:50%;animation:app-spin .7s linear infinite}
      @keyframes app-spin{to{transform:rotate(360deg)}}
      html.app-ready #root{visibility:visible}
      html.app-ready #app-boot{display:none}
    </style>
    <title>Andrey-Fit</title>
    <script>
      if(window.__andreyFitPwaVariant==='trainer')document.title='Andrey-Fit Trainer';
    </script>
  </head>
  <body>
    <div id="app-boot" aria-live="polite">
      <div class="app-boot-card">
        <div class="app-boot-mark"><img src="/icons/icon-192.png" alt="" /></div>
        <div class="app-boot-name">Andrey-Fit</div>
        <div class="app-boot-dot" id="app-boot-dot"></div>
        <div id="app-boot-fallback" style="display:none;max-width:280px;text-align:center;font-size:13px;line-height:1.45;color:#667085">
          Приложение не смогло запуститься вовремя.
          <button type="button" onclick="location.reload()" style="display:block;margin:12px auto 0;border:0;border-radius:10px;padding:10px 14px;background:#168a4a;color:#fff;font:inherit;font-weight:700">Перезагрузить</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.setTimeout(function(){
        if(document.documentElement.classList.contains('app-ready'))return;
        var dot=document.getElementById('app-boot-dot');
        var fallback=document.getElementById('app-boot-fallback');
        if(dot)dot.style.display='none';
        if(fallback)fallback.style.display='block';
      },15000);
    </script>
  </body>
</html>
