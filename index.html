<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#168A4A" />
    <meta name="application-name" content="Andrey-Fit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Andrey-Fit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json?v=6" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      html,body,#root{min-height:100%;margin:0}
      html,body{background:#f4f6f8}
      body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #root{visibility:hidden}
      #app-boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#f4f6f8}
      .app-boot-card{display:flex;flex-direction:column;align-items:center;gap:14px;color:#17202e}
      .app-boot-mark{width:62px;height:62px;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(22,138,74,.18)}
      .app-boot-mark img{display:block;width:100%;height:100%;object-fit:cover}
      .app-boot-name{font-size:18px;font-weight:700}
      .app-boot-dot{width:26px;height:26px;border:3px solid rgba(23,32,46,.12);border-top-color:#168a4a;border-radius:50%;animation:app-spin .7s linear infinite}
      @keyframes app-spin{to{transform:rotate(360deg)}}
      html.app-ready #root{visibility:visible}
      html.app-ready #app-boot{display:none}
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <title>Andrey-Fit</title>
  </head>
  <body>
    <div id="app-boot" aria-hidden="true">
      <div class="app-boot-card">
        <div class="app-boot-mark"><img src="/icons/icon-192.png" alt="" /></div>
        <div class="app-boot-name">Andrey-Fit</div>
        <div class="app-boot-dot"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
