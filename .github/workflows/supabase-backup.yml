name: Supabase encrypted portable backup

on:
  schedule:
    - cron: '43 4 * * 0'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supabase-backup.yml'

permissions:
  contents: read

concurrency:
  group: fitness-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Require backup secrets
        shell: bash
        run: |
          set -euo pipefail
          for var in SUPABASE_DB_URL BACKUP_ENCRYPTION_PASSPHRASE; do
            if [ -z "${!var:-}" ]; then echo "::error::$var not configured"; exit 1; fi
          done
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common ca-certificates curl
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Dump, encrypt and verify
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          base="andrey-fitness-${stamp}"
          PGCONNECT_TIMEOUT=20 /usr/lib/postgresql/17/bin/pg_dump --dbname="$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --schema=public --file="backup/${base}.dump"
          test -s "backup/${base}.dump"
          /usr/lib/postgresql/17/bin/pg_restore --list "backup/${base}.dump" > backup/contents.list
          grep -q 'TABLE DATA' backup/contents.list
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "backup/${base}.dump" -out "backup/${base}.dump.enc" -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "backup/${base}.dump.enc" -out backup/verified.dump -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          cmp -s "backup/${base}.dump" backup/verified.dump
          (cd backup && sha256sum "${base}.dump.enc" > "${base}.dump.enc.sha256")
          rm -f "backup/${base}.dump" backup/verified.dump backup/contents.list
          echo "Encrypted PostgreSQL public-schema dump: ${base}" >> "$GITHUB_STEP_SUMMARY"
          echo "Excludes auth.users and Storage objects. Retained for 90 days." >> "$GITHUB_STEP_SUMMARY"
      - name: Store encrypted backup in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backup/*.enc
            backup/*.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Clean runner
        if: always()
        run: rm -rf backup
