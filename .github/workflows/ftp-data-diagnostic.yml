name: FTP data-channel diagnostic

on:
  push:
    branches:
      - fix/ftp-data-channel

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24 on Windows
        shell: pwsh
        run: |
          $version = '24.21.0'
          $install = Join-Path $env:RUNNER_TEMP "node-v$version-win-x64"
          $install | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install FTP client
        run: npm install --no-save basic-ftp@5.2.1
      - name: Compare EPSV and PASV with one tiny upload each
        env:
          FTP_SERVER: andreway.ru
          FTP_PORT: "21"
          FTP_USERNAME: andreway
          FTP_PASSWORD: ${{ secrets.FIT_FTP_PASSWORD }}
          FTP_REMOTE_DIR: /www/fit.andreway.ru
          FTP_SMOKE_TIMEOUT_MS: "15000"
        run: node scripts/ftp_data_smoke.mjs
