name: Deploy dev to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Require FTP password
        shell: bash
        run: |
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::FTP_PASSWORD secret is not configured."
            exit 1
          fi

      - name: Deploy and verify FTP
        env:
          FTP_SERVER: 89.108.124.162
          FTP_PORT: "21"
          FTP_USERNAME: magazinot
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: www/magazinot.ru/files/andrey-fitness/dev
          FTP_LOCAL_DIR: dist
        run: python3 scripts/deploy_ftp.py
