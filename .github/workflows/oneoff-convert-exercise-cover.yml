name: One-off delete legacy exercise PNG

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oneoff-convert-exercise-cover.yml"

permissions:
  contents: read

jobs:
  delete-legacy-png:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install FTP client
        run: npm install --no-save basic-ftp@5.2.1

      - name: Delete legacy PNG
        env:
          FTP_PASSWORD: ${{ secrets.FIT_FTP_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { Client } from "basic-ftp"
          const client=new Client(30000)
          try{
            await client.access({host:"andreway.ru",port:21,user:"andreway",password:process.env.FTP_PASSWORD,secure:false})
            const remote="/www/fit.andreway.ru/media/exercises/cb14a357-9c2a-4bc2-a653-b897d581f472/image/f511fc00-a397-4882-814e-fef02e555f12.png"
            try{ await client.remove(remote) } catch(error) {
              const msg=error instanceof Error?error.message:""
              if(!/550|not found|no such file/i.test(msg)) throw error
            }
          } finally {
            client.close()
          }
          NODE

      - name: Verify replacement
        run: |
          curl -fLI "https://fit.andreway.ru/media/exercises/cb14a357-9c2a-4bc2-a653-b897d581f472/image/f511fc00-a397-4882-814e-fef02e555f12.webp"
          if curl -fLI "https://fit.andreway.ru/media/exercises/cb14a357-9c2a-4bc2-a653-b897d581f472/image/f511fc00-a397-4882-814e-fef02e555f12.png"; then
            echo "Legacy PNG still exists"
            exit 1
          fi
