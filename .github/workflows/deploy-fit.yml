name: Deploy fit.andreway.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-fit-andreway
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]

    env:
      FIT_FTP_REMOTE_DIR: "/www/fit.andreway.ru"

    steps:
      - name: Check deployment config
        id: config
        shell: pwsh
        env:
          FIT_FTP_PASSWORD: ${{ secrets.FIT_FTP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FIT_FTP_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:FIT_FTP_REMOTE_DIR)) {
            Write-Host "::notice::fit.andreway.ru deploy is waiting for FIT_FTP_PASSWORD and the confirmed FTP root path."
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node 24 on Windows
        if: steps.config.outputs.ready == 'true'
        shell: pwsh
        run: |
          $version = '24.21.0'
          $archive = Join-Path $env:RUNNER_TEMP "node-v$version-win-x64.zip"
          $install = Join-Path $env:RUNNER_TEMP "node-v$version-win-x64"
          if (-not (Test-Path (Join-Path $install 'node.exe'))) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          }
          $install | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $install 'node.exe') --version

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm install

      - name: Build
        if: steps.config.outputs.ready == 'true'
        run: npm run build

      - name: Install FTP client
        if: steps.config.outputs.ready == 'true'
        run: npm install --no-save basic-ftp@5.2.1

      - name: Deploy and verify FTP
        if: steps.config.outputs.ready == 'true'
        env:
          FTP_SERVER: andreway.ru
          FTP_PORT: "21"
          FTP_USERNAME: andreway
          FTP_PASSWORD: ${{ secrets.FIT_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ env.FIT_FTP_REMOTE_DIR }}
          FTP_LOCAL_DIR: dist
          FTP_TIMEOUT_MS: "30000"
          FTP_MAX_ATTEMPTS: "12"
          FTP_RETRY_DELAY_MS: "1000"
        run: node scripts/deploy_ftp.mjs
