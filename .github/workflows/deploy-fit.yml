name: Deploy fit.andreway.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-fit-andreway
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      FIT_FTP_REMOTE_DIR: ""

    steps:
      - name: Check deployment config
        id: config
        shell: bash
        env:
          FIT_FTP_PASSWORD: ${{ secrets.FIT_FTP_PASSWORD }}
        run: |
          if [ -z "$FIT_FTP_PASSWORD" ] || [ -z "$FIT_FTP_REMOTE_DIR" ]; then
            echo "::notice::fit.andreway.ru deploy is waiting for FIT_FTP_PASSWORD and the confirmed FTP root path."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm install

      - name: Build
        if: steps.config.outputs.ready == 'true'
        run: npm run build

      - name: Deploy and verify FTP
        if: steps.config.outputs.ready == 'true'
        env:
          FTP_SERVER: andreway.ru
          FTP_PORT: "21"
          FTP_USERNAME: andreway
          FTP_PASSWORD: ${{ secrets.FIT_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ env.FIT_FTP_REMOTE_DIR }}
          FTP_LOCAL_DIR: dist
        run: python3 scripts/deploy_ftp.py
