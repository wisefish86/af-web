name: PWA installability diagnostic

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy fit.andreway.ru"]
    types: [completed]

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup diagnostic
        run: |
          mkdir -p /tmp/pwa-diagnostic
          cd /tmp/pwa-diagnostic
          npm init -y >/dev/null 2>&1
          npm install chrome-remote-interface@0.33.3 >/dev/null 2>&1

      - name: Start Chrome
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chrome.log
          exit 1

      - name: Check live HTTP resources
        run: |
          echo "=== HTTP ROOT (must redirect to HTTPS) ==="
          curl -sSIL http://fit.andreway.ru/ | sed -n '1,25p'
          echo
          echo "=== HTTPS ROOT ==="
          curl -sSIL https://fit.andreway.ru/ | sed -n '1,25p'
          echo
          echo "=== MANIFEST HEADERS ==="
          curl -sSIL https://fit.andreway.ru/manifest.json | sed -n '1,25p'
          echo
          echo "=== SERVICE WORKER HEADERS ==="
          curl -sSIL https://fit.andreway.ru/sw-v6.js | sed -n '1,25p'
          echo
          echo "=== TRAINER MANIFEST HEADERS ==="
          curl -sSIL https://fit.andreway.ru/manifest-trainer.json | sed -n '1,25p'
          echo
          echo "=== ICON 192 HEADERS ==="
          curl -sSIL https://fit.andreway.ru/icons/icon-192.png | sed -n '1,25p'
          echo
          echo "=== ICON 512 HEADERS ==="
          curl -sSIL https://fit.andreway.ru/icons/icon-512.png | sed -n '1,25p'

      - name: Ask Chrome why the app is not installable
        working-directory: /tmp/pwa-diagnostic
        run: |
          cat > check.cjs <<'EOF'
          const CDP=require('chrome-remote-interface');

          (async()=>{
            const target=await CDP.New({url:'about:blank'});
            const client=await CDP({target});
            const {Page,Runtime,Network,Emulation}=client;
            await Page.enable();
            await Runtime.enable();
            await Network.enable();
            await Emulation.setDeviceMetricsOverride({width:393,height:873,deviceScaleFactor:2.75,mobile:true});
            await Network.setUserAgentOverride({
              userAgent:'Mozilla/5.0 (Linux; Android 16; 25080RABDG) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36',
              platform:'Android'
            });

            const loaded=new Promise(resolve=>Page.loadEventFired(resolve));
            await Page.navigate({url:'https://fit.andreway.ru/#/settings'});
            await loaded;
            await new Promise(r=>setTimeout(r,8000));

            const manifest=await Page.getAppManifest();
            const errors=await Page.getInstallabilityErrors();
            const state=await Runtime.evaluate({
              expression:`(async()=>({
                url:location.href,
                secure:window.isSecureContext,
                manifest:document.querySelector('link[rel="manifest"]')?.href||null,
                hasServiceWorker:'serviceWorker' in navigator,
                swController:!!navigator.serviceWorker?.controller,
                swRegistrations:'serviceWorker' in navigator ? (await navigator.serviceWorker.getRegistrations()).map(r=>({scope:r.scope,active:!!r.active,scriptURL:r.active?.scriptURL||null,installing:!!r.installing,waiting:!!r.waiting})) : [],
                appReady:document.documentElement.classList.contains('app-ready'),
                bootFallbackVisible:document.getElementById('app-boot-fallback') ? getComputedStyle(document.getElementById('app-boot-fallback')).display!=='none' : false,
                rootHasContent:Boolean(document.getElementById('root')?.textContent?.trim()),
                loginVisible:Boolean(document.querySelector('.login-page')),
                authIssueVisible:Boolean(document.querySelector('.auth-issue-screen'))
              }))()`,
              awaitPromise:true,
              returnByValue:true
            });

            console.log('=== CHROME APP MANIFEST ===');
            console.log(JSON.stringify(manifest,null,2));
            console.log('=== ANDROID-MODE CHROME INSTALLABILITY ERRORS ===');
            console.log(JSON.stringify(errors,null,2));
            console.log('=== PAGE STATE ===');
            console.log(JSON.stringify(state.result.value,null,2));

            const pageState=state.result.value;
            if(!pageState.secure)throw new Error('PWA page is not a secure context');
            if(!pageState.manifest?.includes('/manifest.json'))throw new Error('Client manifest is not active');
            if(!pageState.hasServiceWorker)throw new Error('Service Worker API is unavailable');
            if(!pageState.appReady)throw new Error('React app did not reach app-ready state');
            if(pageState.bootFallbackVisible)throw new Error('Boot timeout fallback is visible in production');
            if(!pageState.rootHasContent)throw new Error('React root rendered no visible text');
            if(!pageState.swRegistrations.some(r=>r.active&&r.scriptURL?.includes('/sw-v6.js'))){
              throw new Error('Active sw-v6.js registration was not found');
            }

            await client.close();
            await CDP.Close({id:target.id});
          })().catch(err=>{console.error(err);process.exit(1)});
          EOF
          node check.cjs
