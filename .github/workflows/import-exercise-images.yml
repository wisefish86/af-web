name: Import exercise images

on:
  push:
    branches:
      - main
    paths:
      - scripts/exercise-image-import.json

permissions:
  contents: write

concurrency:
  group: import-exercise-images
  cancel-in-progress: true

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and convert exercise images
        run: python scripts/import-exercise-images.py

      - name: Commit optimized images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d public/media/exercises ]; then
            git add public/media/exercises
          fi
          if git diff --cached --quiet; then
            echo "No exercise image changes to commit."
            exit 0
          fi
          git commit -m "Import optimized exercise images"
          git push
